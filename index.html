<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AliExpress Deals Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #ff6a00;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            width: 250px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-card img {
            width: 100%;
            border-radius: 8px;
            height: auto;
        }
        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        .price {
            font-size: 20px;
            color: #ff6a00;
            margin: 10px 0;
        }
        .buy-btn {
            background: #ff6a00;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
        }
        .buy-btn:hover {
            background: #e65c00;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>🔥 Best AliExpress Deals 🔥</h1>
    <p>Shop top products with exclusive discounts – I earn a small commission at no extra cost to you.</p>
</header>

<div class="product-grid" id="product-list">
    <!-- Products will appear here -->
</div>

<footer>
    <p>© 2025 My AliExpress Store | Affiliate Disclaimer: We earn from qualifying purchases</p>
</footer>

<script>
    // Sample products – replace with your own affiliate links and images
    const products = [
        {
            title: "Wireless Earbuds Bluetooth Headphones",
            price: "$15.99",
            image: "https://ae-pic-a1.aliexpress-media.com/kf/Sf1b2c3d4e5f6a7b8c9d0e1f2g3h4i5j6.jpg_200x200.jpg",
            affiliateLink: "https://s.click.aliexpress.com/e/_example1"
        },
        {
            title: "Smart Watch Fitness Tracker",
            price: "$22.50",
            image: "https://ae-pic-a1.aliexpress-media.com/kf/Se7f8g9h0i1j2k3l4m5n6o7p8q9r0s1t2.jpg_200x200.jpg",
            affiliateLink: "https://s.click.aliexpress.com/e/_example2"
        }
    ];

    const productContainer = document.getElementById('product-list');

    function displayProducts() {
        productContainer.innerHTML = '';
        products.forEach(product => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${product.image}" alt="${product.title}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                <div class="product-title">${product.title}</div>
                <div class="price">${product.price}</div>
                <a href="${product.affiliateLink}" target="_blank" rel="nofollow sponsored" class="buy-btn">Buy Now →</a>
            `;
            productContainer.appendChild(card);
        });
    }

    displayProducts();
</script>
</body>
</html>
